; PHP tuning for (production / local) performance and security
; Keep this file in project root, it is hidden from visitors.
; NOTE: opcache/JIT directives removed for shared-hosting compatibility
; (InfinityFree runs PHP as CGI/FPM without opcache tuning allowed).

session.use_strict_mode=1
session.use_only_cookies=1
session.cookie_httponly=1
session.cookie_samesite=Lax
session.cookie_secure=0

expose_php=Off
memory_limit=256M
max_execution_time=30
upload_max_filesize=5M
post_max_size=8M
max_input_vars=2000
default_charset="UTF-8"
